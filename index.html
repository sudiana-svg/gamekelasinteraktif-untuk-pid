ama yang mencocokkan SEMUA pasangan dengan benar menang.</li><li>Klik <b>Main Lagi</b> untuk pasangan kata baru.</li>','<li>Tim yang giliran menekan <b>PUTAR RODA</b>. Musik berhenti selama roda berputar.</li><li>Roda berhenti di jarum atas dan soal muncul (60 detik). Tombol <b>Batal</b> menutup soal tanpa menjawab.</li><li>Benar: +10 poin, salah: 0. Soal yang sudah dijawab dihapus dari roda, lalu giliran pindah.</li><li>Tim pertama yang mencapai 100 poin menang.</li><li>Klik <b>Main Lagi</b> untuk roda dan skor baru.</li>','<li>Tekan <b>START</b> di tengah atas. Kedua tim mulai bersamaan.</li><li>Seret kotak paragraf ke atas atau ke bawah agar menjadi teks yang runtut dan padu sesuai strukturnya (misalnya pembuka, isi, penutup; atau langkah-langkah berurutan pada procedure).</li><li>Letak benar: bunyi chime dan garis hijau. Salah: bunyi buzzer dan kotak berkedip merah.</li><li>Tim pertama yang menyusun semua paragraf dengan benar menang.</li><li>Klik <b>Main Lagi</b> untuk teks lain (jika ada lebih dari satu teks).</li>','<li>Guru: tempel teks di kotak, pisahkan paragraf dengan baris kosong atau <b>[SPLIT]</b>, lalu klik <b>GENERATE GAME</b>.</li><li>Kedua tim membaca teks yang sama dalam kondisi menyatu.</li><li>Ketuk kotak kecil abu-abu di antara kalimat untuk memotong paragraf baru. Ketuk lagi untuk menyatukan kembali.</li><li>Tekan <b>SUBMIT</b> jika yakin. Jika masih salah, layar berkedip merah dan permainan lanjut.</li><li>Tim pertama dengan potongan 100% benar menang. <b>Main Lagi</b> memakai teks lain (jika ada).</li>','<li>Tekan <b>START</b>. Kata kunci muncul di tengah dalam dua kartu: biru untuk Tim A, merah untuk Tim B.</li><li>Seret kartu timmu ke kotak definisi yang tepat di sisimu. Kedua tim bisa menyeret bersamaan.</li><li>Benar: bunyi ting dan tali tertarik 1 langkah ke timmu, lalu kata berikutnya muncul. Salah: bunyi buzzer, kartu membal ke tengah, tali diam.</li><li>Tim pertama yang menarik tali sampai ujung (unggul +5) menang.</li><li>Klik <b>Main Lagi</b> untuk set kata baru.</li>','<li>Guru: ketik, tempel, atau upload kalimat di layar pengaturan, lalu klik <b>Mulai Balapan</b>. Tiap kalimat menjadi satu ronde.</li><li>Kedua tim mendapat kata-kata yang sama dengan letak acak berbeda.</li><li>Seret kata ke <b>Zona Susun</b> (kotak putus-putus) atau ketuk kata untuk memindahkannya. Urutan di zona bisa digeser, dan kata bisa dikembalikan dengan diketuk.</li><li>Setiap kata yang masuk zona berbunyi ting. Jika semua kata sudah masuk tetapi urutannya salah: buzzer dan teks berkedip merah.</li><li>Tim pertama yang menyusun kalimat dengan benar memenangkan ronde. Tim dengan ronde terbanyak menang.</li>','<li>Guru: isi teks bacaan, instruksi, kata kunci benar (kolom A) dan kata pengalih (kolom B), dipisah koma, lalu klik <b>MULAI GAME</b>.</li><li>Kata-kata muncul dari lubang di kedua sisi secara bersamaan. Ketuk kata yang BENAR sebelum turun lagi.</li><li>Kata benar: +10 poin dan bunyi pop. Kata benar yang diketuk lebih dulu menghilang di kedua sisi.</li><li>Kata salah: -5 poin, layar timmu berkedip merah.</li><li>Waktu 60 detik, atau selesai jika semua kata benar sudah muncul. Skor tertinggi menang.</li>','<li>Guru: isi teks bacaan utama dan minimal 3 pos pertanyaan (1 jawaban benar, 2 salah), lalu klik <b>GENERATE LABIRIN</b>.</li><li>Kedua tim membaca teks dan menjawab pertanyaan pos di sisi masing-masing, lalu mengetuk pintu (A, B, atau C) yang menurut mereka benar.</li><li>Benar: pintu terbuka dengan bunyi chime dan avatar maju ke pos berikutnya.</li><li>Salah: pintu terkunci, avatar terhenti 3 detik, lalu tim berdiskusi memilih pintu lain.</li><li>Tim pertama yang avatarnya mencapai EXIT menang.</li>','<li>Guru: isi judul dan 5-7 kartu berurutan dari 1 (awal/terendah) ke atas, lalu klik <b>GENERATE SOLITAIRE</b>.</li><li>Seret kartu yang terbuka (bagian bawah) ke kotak target di atas. Kartu hanya diterima jika urutan logis berikutnya (1, lalu 2, lalu 3, dan seterusnya).</li><li>Urutan salah: kartu membal ke
